# Knarr for iPhone and iPad, plus a macOS stub whose only job is to make Xcode issue the Mac app's
# CloudKit provisioning profile (scripts/fetch-mac-profile.sh). Generate with `xcodegen generate`.
name: KnarrMobile
options:
  bundleIdPrefix: com.kyen
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
packages:
  Knarr: { path: .. }
settings:
  base:
    DEVELOPMENT_TEAM: "" # Set your own Apple development team before building mobile targets.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  KnarrMobile:
    type: application
    platform: iOS
    sources:
      - path: KnarrMobile
      - path: ../Sources/KnarrUI/Resources/ChatWeb
        type: folder
        buildPhase: resources
    dependencies:
      - package: Knarr
        product: KnarrSync
      - target: KnarrActivityWidget
        embed: true
    entitlements:
      path: KnarrMobile/KnarrMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.kyen.knarr]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: KnarrMobile/Info.plist
      properties:
        CFBundleDisplayName: Knarr
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.kyen.knarr.activity
            CFBundleURLSchemes: [knarr]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyen.knarr.mobile
        # TestFlight needs a higher build number on every upload; bump this before archiving.
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  KnarrMacProfile:
    type: application
    platform: macOS
    sources: [MacProfile]
    entitlements:
      path: MacProfile/Knarr.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.kyen.knarr]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyen.knarr
        GENERATE_INFOPLIST_FILE: YES

  KnarrActivityWidget:
    type: app-extension
    platform: iOS
    sources: [KnarrActivityWidget]
    dependencies:
      - package: Knarr
        product: KnarrSync
    info:
      path: KnarrActivityWidget/Info.plist
      properties:
        CFBundleDisplayName: Knarr
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kyen.knarr.mobile.activity
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
